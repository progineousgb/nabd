[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nabd"
version = "0.1.1"
description = "Local uptime monitor."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pro Gineous"}]

[project.scripts]
nabd = "nabd.server:main"

[tool.setuptools.packages.find]
include = ["nabd"]
